[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-pc-windows-msvc" },
]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
ignore = [
  # neteq =0.8.3 (via buzz-audio-client, huddles-audio feature) declares
  # ringbuf 0.3 but none of its Rust sources reference it (checked
  # 2026-11-07: `grep -rn ringbuf neteq-0.8.3/**/*.rs` is empty), so the
  # Consumer::skip/clear path is unreachable. Same audited exception as
  # block/buzz deny.toml; the bans.deny wrapper rule below keeps every other
  # consumer on a patched ringbuf. Remove when neteq drops the dependency.
  { id = "RUSTSEC-2026-0293", reason = "unused dependency of exactly pinned neteq 0.8.3; no Rust references to ringbuf" },
]

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
  "BSD-3-Clause", "BSL-1.0", "CC0-1.0", "CDLA-Permissive-2.0", "ISC", "MIT",
  "MPL-2.0", "Unicode-3.0", "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
  { name = "ringbuf", version = "<0.5.2", wrappers = ["neteq"], reason = "only audited neteq may declare this unused vulnerable dependency" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/block/buzz"]
