[package]
name = "bzz"
version = "0.14.0"
edition = "2024"
rust-version = "1.98"
description = "A human-first terminal client for Buzz communities"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arpagon/bzz"
homepage = "https://github.com/arpagon/bzz"
keywords = ["nostr", "tui", "buzz", "chat"]
categories = ["command-line-utilities"]

[features]
default = ["huddles-audio"]
# Live huddle audio: microphone capture, playback and Opus (ADR v0.13 huddle audio).
huddles-audio = ["dep:buzz-audio-client", "dep:cpal", "dep:rustix"]

[[bin]]
name = "bzz"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
arboard = { version = "=3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
async-trait = "0.1"
base64 = "0.22"
buzz-core = { version = "=0.1.0", git = "https://github.com/block/buzz", rev = "bf3bdd0eaefe39289bf9620594f254c7f68897f5" }
buzz-sdk = { version = "=0.1.0", git = "https://github.com/block/buzz", rev = "bf3bdd0eaefe39289bf9620594f254c7f68897f5" }
buzz-audio-client = { version = "=0.1.0", git = "https://github.com/block/buzz", rev = "bf3bdd0eaefe39289bf9620594f254c7f68897f5", default-features = false, features = ["webpki-roots"], optional = true }
cpal = { version = "0.16", optional = true }
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
futures-util = "0.3"
hex = "0.4"
icu_properties = "2.2"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
infer = "0.19"
# Compile libdbus from the locked source crate; no libdbus-1-dev download
# is needed when building Linux binaries (the Secret Service API is unchanged).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "vendored"] }
nostr = { version = "0.44", features = ["nip44", "nip49", "nip98"] }
nucleo-matcher = "0.3"
opentelemetry-proto = { version = "=0.32.0", default-features = false, features = ["gen-tonic-messages", "logs"] }
prost = "=0.14.3"
pulldown-cmark = { version = "0.13", default-features = false }
rand = "0.9"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache", "unstable-rendered-line-info"] }
ratatui-image = { version = "=11.0.5", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rpassword = "7"
rusqlite = { version = "0.41", features = ["backup", "bundled", "serde_json"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "local-offset", "parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal", "fs"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["file_chooser", "tokio"] }

# ALSA writes plugin errors straight to fd 2; huddle device setup silences
# it so the full-screen TUI is never corrupted (safe `dup2`).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "stdio"], optional = true }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
rfd = { version = "=0.17.2", default-features = false }

[dev-dependencies]
criterion = "0.7"
# Test-only NIP-FI issuer (fake NIP-FA adapter signs ES256 assertions).
p256 = { version = "0.13", features = ["ecdsa", "jwk"] }
insta = "1"
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[[example]]
name = "promo_fixture"
# Its huddle scene joins with live audio.
required-features = ["huddles-audio"]

[[bench]]
name = "timeline"
harness = false

[[bench]]
name = "store"
harness = false

[[bench]]
name = "media"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dist]
inherits = "release"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
