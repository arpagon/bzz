[package]
name = "bzz"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "A human-first terminal client for Buzz communities"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arpagon/bzz"
homepage = "https://github.com/arpagon/bzz"
keywords = ["nostr", "tui", "buzz", "chat"]
categories = ["command-line-utilities"]

[[bin]]
name = "bzz"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
async-trait = "0.1"
base64 = "0.22"
buzz-core = { version = "=0.1.0", git = "https://github.com/block/buzz", rev = "ede26863345a518ec46edd6d7692e0281883491b" }
buzz-sdk = { version = "=0.1.0", git = "https://github.com/block/buzz", rev = "ede26863345a518ec46edd6d7692e0281883491b" }
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
futures-util = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
infer = "0.19"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
nostr = { version = "0.44", features = ["nip44", "nip49", "nip98"] }
nucleo-matcher = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
rand = "0.9"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
ratatui-image = { version = "=11.0.5", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rpassword = "7"
rusqlite = { version = "0.37", features = ["backup", "bundled", "serde_json"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "local-offset", "parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal", "process", "fs"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[dev-dependencies]
criterion = "0.7"
insta = "1"
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[[bench]]
name = "timeline"
harness = false

[[bench]]
name = "store"
harness = false

[[bench]]
name = "media"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dist]
inherits = "release"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
