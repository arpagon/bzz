[package]
name = "bzz"
version = "0.17.0"
edition = "2024"
rust-version = "1.98"
description = "A human-first terminal client for Buzz communities"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arpagon/bzz"
homepage = "https://github.com/arpagon/bzz"
keywords = ["nostr", "tui", "buzz", "chat"]
categories = ["command-line-utilities"]

[features]
default = ["huddles-audio", "apps"]
# Apps in the channel: a Lua 5.4 interpreter inside bzz, with a closed API
# (ADR v0.16 apps). Builds without it have no interpreter and no C of Lua.
apps = ["dep:mlua", "dep:memchr"]
# Live huddle audio: microphone capture, playback and Opus (ADR v0.13 huddle audio).
huddles-audio = ["dep:buzz-audio-client", "dep:cpal", "dep:pulseaudio"]

[[bin]]
name = "bzz"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
arboard = { version = "=3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
async-trait = "0.1"
base64 = "0.22"
buzz-core = { version = "=0.1.0", git = "https://github.com/block/buzz", rev = "bf3bdd0eaefe39289bf9620594f254c7f68897f5" }
buzz-sdk = { version = "=0.1.0", git = "https://github.com/block/buzz", rev = "bf3bdd0eaefe39289bf9620594f254c7f68897f5" }
buzz-audio-client = { version = "=0.1.0", git = "https://github.com/block/buzz", rev = "bf3bdd0eaefe39289bf9620594f254c7f68897f5", default-features = false, features = ["webpki-roots"], optional = true }
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
futures-util = "0.3"
hex = "0.4"
icu_properties = "2.2"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
infer = "0.19"
# Compile libdbus from the locked source crate; no libdbus-1-dev download
# is needed when building Linux binaries (the Secret Service API is unchanged).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "vendored"] }
# The interpreter of apps (feature `apps`). `lua54` is the language of the
# contract (plan D1); `vendored` compiles Lua's own C from the locked
# `lua-src` crate into the binary, so nothing is installed or looked up at
# build or run time. No other feature: no `send` (an interpreter lives and
# dies on its app's thread), no `async`, `serde` or `macros`.
mlua = { version = "=0.12.2", default-features = false, features = ["lua54", "vendored"], optional = true }
# The plain search of the apps' bounded string library (feature `apps`):
# linear in the worst case, where Lua's own is quadratic. Locked already,
# as a dependency of several crates.
memchr = { version = "2", optional = true }
nostr = { version = "0.44", features = ["nip44", "nip49", "nip98"] }
nucleo-matcher = "0.3"
opentelemetry-proto = { version = "=0.32.0", default-features = false, features = ["gen-tonic-messages", "logs"] }
prost = "=0.14.3"
pulldown-cmark = { version = "0.13", default-features = false }
rand = "0.9"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache", "unstable-rendered-line-info"] }
ratatui-image = { version = "=11.0.5", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rpassword = "7"
rusqlite = { version = "0.41", features = ["backup", "bundled", "serde_json"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a number is parsed to the nearest double, so that a
# record's number reaches an app or an agent as the relay holds it and goes
# back unchanged (v0.17 F4). The fast parsing is off by one unit in the last
# place for some numbers of seventeen digits.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "local-offset", "parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal", "fs", "process", "io-std"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["file_chooser", "tokio"] }
# Huddle devices on Linux (feature `huddles-audio`): the PulseAudio protocol
# in pure Rust, spoken to PulseAudio or to PipeWire's pipewire-pulse. No C
# library, so the binary does not name libasound.so.2 and starts on a
# machine without sound (plan v0.17.0 D3; ADR v0.13 huddle audio).
pulseaudio = { version = "=0.3.2", optional = true }

# Huddle devices on macOS and Windows (CoreAudio, WASAPI).
[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = { version = "0.16", optional = true }

# Huddle device setup through cpal (macOS) runs with fd 2 silenced, so a
# sound library writing errors there cannot corrupt the full-screen TUI
# (safe `dup2`; written for ALSA, which Linux no longer uses). Linux huddle devices read the user id through it
# (the default socket path). The agent runtime signals a harness's process
# group through it (safe `kill`).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "stdio", "process"] }
# Before bzz starts an agent's harness it marks every descriptor it holds
# beyond the three standard streams as not to be handed on, also those bzz
# itself inherited from the terminal it was started in: a real command an
# agent runs would get them (docs/agent-host-protocol.md, section 2). Safe
# Rust cannot name a descriptor it did not open; `set_fds_cloexec` is a safe
# function that does. Its only dependencies, cfg-if and libc, are here already.
close_fds = "0.3"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
rfd = { version = "=0.17.2", default-features = false }

[dev-dependencies]
criterion = "0.7"
# Test-only NIP-FI issuer (fake NIP-FA adapter signs ES256 assertions).
p256 = { version = "0.13", features = ["ecdsa", "jwk"] }
insta = "1"
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[[example]]
name = "app_host"
# The app runtime alone in a terminal, for the apps bench.
required-features = ["apps"]

[[example]]
name = "promo_fixture"
# Its huddle scene joins with live audio.
required-features = ["huddles-audio"]

[[bench]]
name = "timeline"
harness = false

[[bench]]
name = "store"
harness = false

[[bench]]
name = "media"
harness = false

[[bench]]
name = "agents"
harness = false

[[bench]]
name = "apps"
harness = false
# One app open: memory, redraw and key to screen (v0.16 M8).
required-features = ["apps"]

[[bench]]
name = "palette"
harness = false
# The palette's filter over 3,500 rows and its frame (v0.17 C1).

# A development build stays usable in a huddle on Linux. Unoptimised, the
# `pulseaudio` crate spends about 4 ms growing its buffer before every read,
# and it writes playback only when a read finds nothing waiting: with
# capture arriving every few milliseconds that moment never comes, and
# playback starves (found in CI's audio job, v0.17). Release builds are not
# affected.
[profile.dev.package.pulseaudio]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dist]
inherits = "release"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
