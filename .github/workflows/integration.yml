name: Pinned Buzz integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/protocol/**'
      - 'src/realtime/**'
      - 'src/sync/**'
      - 'src/store/**'
      - 'src/service/**'
      - 'src/app.rs'
      - 'tests/relay_integration.rs'
      - 'scripts/test-relay.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches: [main]
    paths:
      - 'src/protocol/**'
      - 'src/realtime/**'
      - 'src/sync/**'
      - 'src/store/**'
      - 'src/service/**'
      - 'src/app.rs'
      - 'tests/relay_integration.rs'
      - 'scripts/test-relay.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: block/buzz
          ref: ede26863345a518ec46edd6d7692e0281883491b
          path: .buzz-source
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Run isolated real-relay suite
        env:
          BZZ_BUZZ_SOURCE: ${{ github.workspace }}/.buzz-source
        run: ./scripts/test-relay.sh
