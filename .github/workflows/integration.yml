name: Pinned Buzz integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/agents/**'
      - 'src/protocol/**'
      - 'src/realtime/**'
      - 'src/sync/**'
      - 'src/store/**'
      - 'src/service/**'
      - 'src/app.rs'
      - 'src/ui/agents.rs'
      - 'migrations/**'
      - 'tests/relay_integration.rs'
      - 'scripts/test-relay.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches: [main]
    paths:
      - 'src/agents/**'
      - 'src/protocol/**'
      - 'src/realtime/**'
      - 'src/sync/**'
      - 'src/store/**'
      - 'src/service/**'
      - 'src/app.rs'
      - 'src/ui/agents.rs'
      - 'migrations/**'
      - 'tests/relay_integration.rs'
      - 'scripts/test-relay.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux keychain build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: actions/checkout@v4
        with:
          repository: block/buzz
          ref: 9f55bf67456be10ff7c8238bf0d9e12e582848f6
          path: .buzz-source
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Run isolated real-relay suite
        env:
          BZZ_BUZZ_SOURCE: ${{ github.workspace }}/.buzz-source
        run: ./scripts/test-relay.sh
