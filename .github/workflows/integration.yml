name: Pinned Buzz integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/agents/**'
      - 'src/protocol/**'
      - 'src/realtime/**'
      - 'src/sync/**'
      - 'src/store/**'
      - 'src/service/**'
      - 'src/app.rs'
      - 'src/ui/agents.rs'
      - 'migrations/**'
      - 'tests/relay_integration.rs'
      - 'tests/relay_nip_fi_integration.rs'
      - 'tests/support/**'
      - 'examples/**'
      - 'scripts/test-relay.sh'
      - '.github/workflows/integration.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches: [main]
    paths:
      - 'src/agents/**'
      - 'src/protocol/**'
      - 'src/realtime/**'
      - 'src/sync/**'
      - 'src/store/**'
      - 'src/service/**'
      - 'src/app.rs'
      - 'src/ui/agents.rs'
      - 'migrations/**'
      - 'tests/relay_integration.rs'
      - 'tests/relay_nip_fi_integration.rs'
      - 'tests/support/**'
      - 'examples/**'
      - 'scripts/test-relay.sh'
      - '.github/workflows/integration.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    # Compose talks to the runner's Docker daemon. The harness's localhost
    # ports must be reachable from the job container, not a nested daemon.
    container:
      image: ghcr.io/arpagon/bzz-build@sha256:e708b63bb48e56a1c790b2dae3cfa1d878df419fa78ac01dc2b4b2544a80c94d
      options: --network host --volume /var/run/docker.sock:/var/run/docker.sock
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [default, nip-fi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: block/buzz
          ref: f3b127e3af5c14d2314faa2b63556c3f51ec6743
          path: .buzz-source
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Run isolated real-relay suite (${{ matrix.profile }})
        env:
          BZZ_BUZZ_SOURCE: ${{ github.workspace }}/.buzz-source
        run: ./scripts/test-relay.sh ${{ matrix.profile == 'nip-fi' && '--nip-fi' || '' }}
