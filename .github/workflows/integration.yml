name: Pinned Buzz integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/agents/**'
      - 'src/protocol/**'
      - 'src/realtime/**'
      - 'src/sync/**'
      - 'src/store/**'
      - 'src/service/**'
      - 'src/app.rs'
      - 'src/ui/agents.rs'
      - 'migrations/**'
      - 'tests/relay_integration.rs'
      - 'tests/relay_nip_fi_integration.rs'
      - 'tests/support/**'
      - 'examples/**'
      - 'scripts/test-relay.sh'
      - '.github/workflows/integration.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches: [main]
    paths:
      - 'src/agents/**'
      - 'src/protocol/**'
      - 'src/realtime/**'
      - 'src/sync/**'
      - 'src/store/**'
      - 'src/service/**'
      - 'src/app.rs'
      - 'src/ui/agents.rs'
      - 'migrations/**'
      - 'tests/relay_integration.rs'
      - 'tests/relay_nip_fi_integration.rs'
      - 'tests/support/**'
      - 'examples/**'
      - 'scripts/test-relay.sh'
      - '.github/workflows/integration.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    env:
      BZZ_BUILD_IMAGE: ghcr.io/arpagon/bzz-build@sha256:e708b63bb48e56a1c790b2dae3cfa1d878df419fa78ac01dc2b4b2544a80c94d
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [default, nip-fi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: block/buzz
          ref: bf3bdd0eaefe39289bf9620594f254c7f68897f5
          path: .buzz-source
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Run isolated real-relay suite (${{ matrix.profile }})
        # Actions job containers attach to an Actions bridge and cannot use
        # --network host. Run this one container explicitly so the harness
        # reaches Compose's localhost ports without a nested Docker daemon.
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          docker run --rm --network host \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "${CARGO_HOME:-$HOME/.cargo}:/opt/bzz-cargo" \
            --volume "${RUSTUP_HOME:-$HOME/.rustup}:/opt/bzz-rustup" \
            --workdir "$GITHUB_WORKSPACE" \
            --env CARGO_HOME=/opt/bzz-cargo --env RUSTUP_HOME=/opt/bzz-rustup \
            --env PATH=/opt/bzz-cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --env BZZ_BUZZ_SOURCE="$GITHUB_WORKSPACE/.buzz-source" \
            --env PROFILE \
            "$BZZ_BUILD_IMAGE" bash -ec '
              git config --global --add safe.directory "$PWD"
              git config --global --add safe.directory "$BZZ_BUZZ_SOURCE"
              if [[ "$PROFILE" == nip-fi ]]; then
                ./scripts/test-relay.sh --nip-fi
              else
                ./scripts/test-relay.sh
              fi
            '
