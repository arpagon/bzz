name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux keychain build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/bzz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/bzz
          - os: macos-14
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/bzz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/bzz.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux keychain build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.95.0
        with: { targets: '${{ matrix.target }}' }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Smoke-test release binary
        shell: bash
        run: ${{ matrix.binary }} --version
      - name: Test identity, backup, config, and keymap on target OS
        run: cargo test --locked --target ${{ matrix.target }} --lib --test auth_test --test config_test --test terminal_restore_test
      - name: Prepare temporary macOS keychain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/bzz-ci.keychain"
          security create-keychain -p bzz-ci-only "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p bzz-ci-only "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
      - name: Smoke-test native keychain
        if: runner.os != 'Linux'
        shell: bash
        run: |
          smoke_root="$(mktemp -d)"
          export BZZ_CONFIG_DIR="$smoke_root/config" BZZ_DATA_DIR="$smoke_root/data" BZZ_CACHE_DIR="$smoke_root/cache"
          ${{ matrix.binary }} identity new --label ci-keychain
          identities="$(${{ matrix.binary }} identity list)"
          printf '%s\n' "$identities" >&2
          identity_id="$(printf '%s\n' "$identities" | awk '$2 == "ci-keychain" { print $1 }')"
          test -n "$identity_id"
          ${{ matrix.binary }} identity verify "$identity_id"
          ${{ matrix.binary }} identity remove "$identity_id" --yes
