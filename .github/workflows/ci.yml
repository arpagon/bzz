name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    container: ghcr.io/arpagon/bzz-build@sha256:e708b63bb48e56a1c790b2dae3cfa1d878df419fa78ac01dc2b4b2544a80c94d
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # v0.16: `apps` is a feature on by default; a build without it has no
      # interpreter and no C of Lua, and must still build, lint and pass.
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      # `--all-targets` builds the examples as tests and leaves no
      # target/debug/examples/scripted_harness, which the tests of the agent
      # runtime start as a program.
      - run: cargo build --locked --example scripted_harness
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --no-default-features --lib
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/bzz
            container: ghcr.io/arpagon/bzz-build@sha256:e708b63bb48e56a1c790b2dae3cfa1d878df419fa78ac01dc2b4b2544a80c94d
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/bzz
          - os: macos-15
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/bzz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/bzz.exe
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || null }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with: { targets: '${{ matrix.target }}' }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Smoke-test release binary
        shell: bash
        run: ${{ matrix.binary }} --version
      # The release binary of each system, kept three days: what a person or
      # a virtual machine opens in a real terminal before a release
      # (docs/e2e-windows.md, docs/e2e-manual.md). Not a release artifact:
      # those come from the Release workflow, signed and attested.
      - name: Keep the binary for hands-on checks
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bzz-${{ matrix.target }}
          path: ${{ matrix.binary }}
          retention-days: 3
          if-no-files-found: error
      # v0.17: on Linux bzz speaks the sound server's protocol itself, so the
      # binary names no sound library and starts where none is installed.
      - name: The Linux release binary names no sound library
        if: runner.os == 'Linux'
        run: ./scripts/check-linux-linkage.sh ${{ matrix.binary }}
      # `--lib` holds the app runtime, the six apps' cases, the session, the
      # store of apps and the pane (v0.16); the three `app_*` tests are the
      # command line and the records on a scripted relay, with real sockets.
      # The hosted macOS and Windows runners stop a script later than a
      # developer's machine does (a debug build, a shared core): the stop
      # tests get three seconds of margin here. The `test` job keeps theirs.
      - name: Test identity, backup, config, Inbox, DMs, search, keymap and apps on target OS
        env:
          BZZ_APPS_STOP_MARGIN_MS: 3000
        run: cargo test --locked --target ${{ matrix.target }} --lib --test auth_test --test config_test --test inbox_dm_search_test --test store_migration_test --test terminal_restore_test --test app_cli_test --test app_session_test --test app_records_test
      - name: Prepare temporary macOS keychain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/bzz-ci.keychain"
          security create-keychain -p bzz-ci-only "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p bzz-ci-only "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
      - name: Smoke-test native keychain
        if: runner.os != 'Linux'
        shell: bash
        run: |
          smoke_root="$(mktemp -d)"
          export BZZ_CONFIG_DIR="$smoke_root/config" BZZ_DATA_DIR="$smoke_root/data" BZZ_CACHE_DIR="$smoke_root/cache"
          ${{ matrix.binary }} identity new --label ci-keychain
          identities="$(${{ matrix.binary }} identity list)"
          printf '%s\n' "$identities" >&2
          identity_id="$(printf '%s\n' "$identities" | awk '$2 == "ci-keychain" { print $1 }')"
          test -n "$identity_id"
          ${{ matrix.binary }} identity verify "$identity_id"
          ${{ matrix.binary }} identity remove "$identity_id" --yes
  upgrade:
    # Release acceptance: a real profile of the last release (v0.16.0) opened
    # by this build on three systems; the one before it (v0.15.0) on Linux.
    # macOS on Intel: hosted Apple Silicon runners are scarce, and on
    # 2026-11-24 jobs waiting for `macos-15` were cancelled after 15 minutes
    # ("not acquired by Runner of type hosted"). The profile does not depend
    # on the processor; the `build` job still tests on Apple Silicon.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        from: ['0160']
        include:
          - os: ubuntu-latest
            from: '0150'
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.os == 'ubuntu-latest' && 'ghcr.io/arpagon/bzz-build@sha256:e708b63bb48e56a1c790b2dae3cfa1d878df419fa78ac01dc2b4b2544a80c94d' || null }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Open a profile of v${{ matrix.from }} with this build
        shell: bash
        env:
          BZZ_UPGRADE_FROM_VERSION: ${{ matrix.from }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/upgrade-test.sh
  apps-bench:
    # v0.16: the app runtime judged with the six apps in a real terminal
    # (scripts/test-apps-bench.sh): their cases at 80x24 and 40x16, reload,
    # pushes and the hostile script. Linux only: it drives a pseudo-terminal
    # and reads /proc. The same cases run on every system as `--lib` tests.
    runs-on: ubuntu-latest
    container: ghcr.io/arpagon/bzz-build@sha256:e708b63bb48e56a1c790b2dae3cfa1d878df419fa78ac01dc2b4b2544a80c94d
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/test-apps-bench.sh --release
  audio:
    # T7: huddle audio through a virtual device (tests/huddle_device_loopback_test.rs).
    # Linux: bzz speaks the PulseAudio protocol; the job's image has
    # PulseAudio. PipeWire (pipewire-pulse) is not in it and no product
    # workflow installs packages, so PipeWire on Debian and EL9 is proven in
    # containers by scripts/test-audio-containers.sh (docs/validation-v0.17.0).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            experimental: false
          - os: macos-15
            experimental: false
          # Hosted Windows runners expose no audio endpoint, so opening the
          # default devices fails there; the result is recorded, not required.
          - os: windows-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.os == 'ubuntu-latest' && 'ghcr.io/arpagon/bzz-build@sha256:e708b63bb48e56a1c790b2dae3cfa1d878df419fa78ac01dc2b4b2544a80c94d' || null }}
    continue-on-error: ${{ matrix.experimental }}
    # T7 itself takes under 10 s (docs/validation-v0.17.0/ci.md); the rest is
    # the build. Until v0.17.0 it could hang for hours (a debug build of the
    # `pulseaudio` crate starved playback).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install BlackHole
        if: runner.os == 'macOS'
        run: |
          brew install --cask blackhole-2ch
          sudo killall coreaudiod || true
          sleep 5
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Tone round trip and device release through a virtual device
        shell: bash
        # An experimental row reports its result in this step and passes the
        # job: with `continue-on-error` on the job alone, the run passes but
        # the job and the pull request's check still show as failed.
        continue-on-error: ${{ matrix.experimental }}
        # Compiling the test is part of this step (2 to 3 minutes on Linux).
        timeout-minutes: 15
        run: ./scripts/test-audio-loopback.sh
  agent-host:
    # v0.15.0 M2 and M3: the Pi Durable agent host (agent-host/). Node only:
    # no Rust, no relay, no model and no network beyond this machine.
    # macOS on Intel: Node does not care which processor, and hosted Apple
    # Silicon runners are scarce (see `upgrade`).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: agent-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --version && git --version
      # As bzz installs it on first use: from the lock file, with install scripts off.
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Audit the packages an agent runs with
        if: runner.os == 'Linux'
        run: npm audit --omit=dev
      - name: The same tests without optional packages (no native builds, no LGPL xz binding)
        if: runner.os == 'Linux'
        run: |
          rm -rf node_modules
          npm ci --ignore-scripts --omit=dev --omit=optional
          npm test
  agent-adapters:
    # v0.15.0 M6: the two ACP adapters bzz installs for the codex and
    # claude-code harnesses (agent-adapters/). Installed as bzz installs
    # them on first use: from the lock file, without install scripts and
    # without their optional packages. No sign-in, no model, no session.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter:
          - { folder: claude-code, package: '@agentclientprotocol/claude-agent-acp' }
          - { folder: codex, package: '@agentclientprotocol/codex-acp' }
    defaults:
      run:
        shell: bash
        working-directory: agent-adapters/${{ matrix.adapter.folder }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --omit=optional --omit=dev
      - name: The adapter's entry is there
        run: test -f "node_modules/${{ matrix.adapter.package }}/dist/index.js"
      - name: Audit the packages an agent runs with
        run: npm audit --omit=dev --omit=optional
