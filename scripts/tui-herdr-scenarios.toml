# Harness scenarios: `scripts/test-relay.sh --herdr` starts a fresh pinned
# relay, writes a disposable profile and generated content
# (examples/harness_fixture.rs) and runs these against the release binary.
#
# A scenario with `args` runs `bzz <args>` on that profile instead of the
# TUI, and answers what it asks on the terminal with keys. `{fixture}` is the
# fixture's folder. `profile = "second"` is the fixture's second profile of
# the same owner. In `keys`, `type:<text>` is typed one key event per
# character. A step may name text that must not be on the screen (`absent`),
# its own time limit in milliseconds (`timeout`), `regex = true` when
# `visible` is a pattern, and `pause`, milliseconds to wait before its keys
# are sent. The `t15-*` scenarios run in the order written here: later ones
# use what earlier ones made.

[[scenario]]
id = "t9-system-group-read-only"
kind = "harness"
description = "M1: the System group stays collapsed until :system; a guest in an announce channel gets the fixed read-only notice instead of a composer."
ready = "online"
exit = "__BZZ_HERDR_EXIT__:0"

[[scenario.step]]
keys = [":", "s", "y", "s", "t", "e", "m", "enter"]
visible = "⚙ open"

[[scenario.step]]
keys = ["space", "space"]
visible = "channel finder"

[[scenario.step]]
keys = ["t", "9", "-", "a", "n", "n", "enter"]
visible = "read-only · announce channel (guest)"

[[scenario.step]]
keys = ["i"]
visible = "read-only · announce channel (guest)"

[[scenario.step]]
keys = ["q"]
visible = "quit bzz?"

[[scenario.step]]
keys = ["y"]
visible = "__BZZ_HERDR_EXIT__:0"

