# Versioned, non-secret acceptance scenarios for scripts/test-tui-herdr.sh.
# Automated scenarios use an empty isolated configuration. Operator scenarios
# are documented in docs/e2e-herdr.md and require public disposable fixtures.
version = 1

[[scenario]]
id = "startup-help-quit"
kind = "automated"
description = "Release binary starts with an empty isolated profile, opens generated help, and restores its terminal on normal quit."
ready = "Welcome to bzz"
exit = "__BZZ_HERDR_EXIT__:0"

[[scenario.step]]
keys = ["shift+?"]
visible = "effective keymap"

[[scenario.step]]
keys = ["esc"]
visible = "Welcome to bzz"

[[scenario.step]]
keys = ["q"]
visible = "quit bzz?"

[[scenario.step]]
keys = ["y"]
visible = "__BZZ_HERDR_EXIT__:0"

[[scenario]]
id = "custom-keymap-inbox"
kind = "automated"
description = "An isolated custom keymap routes a sequence to Inbox without using terminal text paste."
ready = "Welcome to bzz"
exit = "__BZZ_HERDR_EXIT__:0"
keymap = '''
[[binding]]
scope = "workspace"
keys = ["z", "i"]
action = "open-inbox"
'''

[[scenario.step]]
keys = ["z", "i"]
visible = "Welcome to bzz"

# `U` (mark unread) is bound only in the Inbox scope, and it fits a 40-row
# pane; the longer Inbox list continues below the fold.
[[scenario.step]]
keys = ["shift+?"]
visible = "mark unread"

[[scenario.step]]
keys = ["esc"]
visible = "Welcome to bzz"

[[scenario.step]]
keys = ["q"]
visible = "Welcome to bzz"

[[scenario.step]]
keys = ["q"]
visible = "quit bzz?"

[[scenario.step]]
keys = ["y"]
visible = "__BZZ_HERDR_EXIT__:0"

[[scenario]]
id = "v013-panels-empty-profile"
kind = "automated"
description = "v0.13 commands on an empty isolated profile: the broker panel opens and is not serving, huddles and My tasks explain they need a connected community, presence reports it is off, and the terminal restores on quit."
ready = "Welcome to bzz"
exit = "__BZZ_HERDR_EXIT__:0"

[[scenario.step]]
keys = [":", "b", "r", "o", "k", "e", "r", "enter"]
visible = "agent broker · not serving"

[[scenario.step]]
keys = ["esc"]
visible = "Welcome to bzz"

[[scenario.step]]
keys = [":", "h", "u", "d", "d", "l", "e", "enter"]
visible = "select a channel in a connected community"

[[scenario.step]]
keys = [":", "t", "a", "s", "k", "s", "enter"]
visible = "connect to a community to see artifacts"

[[scenario.step]]
keys = [":", "p", "r", "e", "s", "e", "n", "c", "e", "enter"]
visible = "presence: off"

[[scenario.step]]
keys = ["q"]
