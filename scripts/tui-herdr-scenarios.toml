description = "v0.16 M4 exit gate: the Poll, written from its template, is added in the TUI and runs only after its approval there; a version that does not load is never offered; one that loads and fails as it is put to run leaves the old one running; an approved change replaces it in place with its state, and a rollback brings the old one back, with the state."
ready = "online"
exit = "__BZZ_HERDR_EXIT__:0"
size = "120x30"

[[scenario.step]]
run = "\"$BZZ_BIN\" app new poll --template poll --to {fixture}/poll-app"
keys = ["space", "space"]
visible = "channel finder"

# The writing dock names the channel. Not its first message: after the
# v0.15 scenarios have talked in #t15-agents it is no longer on screen.
[[scenario.step]]
keys = ["type:t15-ag", "enter"]
visible = "message #t15-agents"

# Added in the TUI: shown at once for an answer, and nothing of it runs.
[[scenario.step]]
keys = [":", "type:app add {fixture}/poll-app", "enter"]
visible = "a version of an app waits for your answer"
timeout = 30000

[[scenario.step]]
keys = []
visible = "poll (Poll), version 1"

[[scenario.step]]
keys = []
visible = "Record types: poll, vote"

[[scenario.step]]
keys = ["esc"]
visible = "poll: version 1 from you waits for your approval · Ctrl-Y to see and answer it"

[[scenario.step]]
keys = [":", "type:app open poll", "enter"]
visible = "poll has no approved version (one waits for your answer)"
absent = "No poll yet"

# Approved where it is shown, after all of it was on screen.
[[scenario.step]]
keys = ["ctrl+y"]
visible = "poll (Poll), version 1"

[[scenario.step]]
keys = ["a"]
visible = "scroll to the end first"

[[scenario.step]]
keys = ["G"]
visible = "(: the end|that is the whole version)"
regex = true

[[scenario.step]]
keys = ["a"]
visible = "poll: version 1 approved, the script of hash"

[[scenario.step]]
keys = [":", "type:app open poll", "enter"]
visible = "No poll yet. Press a to ask a question."

[[scenario.step]]
keys = ["a", "type:Lunch?", "enter"]
visible = "Poll created."

[[scenario.step]]
keys = ["a", "type:Tacos", "enter"]
visible = "Option added."

[[scenario.step]]
keys = ["a", "type:Sushi", "enter"]
visible = "[ ] Sushi"

[[scenario.step]]
keys = ["enter"]
visible = "Voted for Tacos."

[[scenario.step]]
keys = []
visible = "By: you"

# The selection on Sushi is the app's own state: it must survive.
[[scenario.step]]
keys = ["j"]
visible = "> [ ] Sushi"

# A version that does not load: recorded as failed, never offered.
[[scenario.step]]
run = "printf '\\nreturn app(\\n' >> {fixture}/poll-app/app.lua"
keys = ["ctrl+c", ":", "type:app add {fixture}/poll-app", "enter"]
visible = "poll: version 2 does not load, nothing changed"
timeout = 30000
absent = "waits for your approval"

# One that loads apart and fails in the open app: app.reload raises.
[[scenario.step]]
run = "\"$BZZ_BIN\" app new poll --template poll --to {fixture}/poll-3 && printf 'function app.reload(s, ctx) error(\"version 3 cannot take this state\") end\\n' > {fixture}/reload.lua && python3 -c 'import sys; p=sys.argv[1]; s=open(p).read(); s=s.replace(\"\\nreturn app\", \"\\n\" + open(sys.argv[2]).read() + \"return app\"); open(p, \"w\").write(s)' {fixture}/poll-3/app.lua {fixture}/reload.lua"
keys = [":", "type:app add {fixture}/poll-3", "enter"]
visible = "poll (Poll), version 3"
timeout = 30000

[[scenario.step]]
keys = ["G"]
visible = "(: the end|that is the whole version)"
regex = true

[[scenario.step]]
keys = ["a"]
visible = "poll: version 3 failed to run; version 1 goes on"

[[scenario.step]]
keys = []
visible = "> [ ] Sushi"

[[scenario.step]]
keys = []
visible = "Total: 1 vote"

# An approved change: in place, with the selection.
[[scenario.step]]
run = "\"$BZZ_BIN\" app new poll --template poll --to {fixture}/poll-4 && sed -i 's/\"Total: \"/\"In all: \"/' {fixture}/poll-4/app.lua"
keys = [":", "type:app add {fixture}/poll-4", "enter"]
visible = "poll (Poll), version 4"
timeout = 30000

[[scenario.step]]
keys = []
visible = "The same as the version that runs."

[[scenario.step]]
keys = ["G"]
visible = "(: the end|that is the whole version)"
regex = true

[[scenario.step]]
keys = ["a"]
visible = "poll: version 4 runs in place of 1, its state kept"

[[scenario.step]]
keys = []
visible = "In all: 1 vote"

[[scenario.step]]
keys = []
visible = "> [ ] Sushi"

# Rollback with the app open: version 1 again, the selection kept. The
# command's own answer is replaced on the status line as soon as the pane
# has taken the version, so either sentence shows that the rollback happened.
[[scenario.step]]
keys = [":", "type:app rollback poll", "enter"]
visible = "(poll: back to version 1 from 4|poll: version 1 runs in place of 4, its state kept)"
regex = true

[[scenario.step]]
keys = []
visible = "Total: 1 vote"

[[scenario.step]]
keys = []
visible = "> [ ] Sushi"

[[scenario.step]]
keys = ["q"]
visible = "quit bzz?"

[[scenario.step]]
keys = ["y"]
visible = "__BZZ_HERDR_EXIT__:0"

