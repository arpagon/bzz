# ---- v0.15.0: the TUI, with the real agent host on its stand-in model -----
# The stand-in answers "pong: this conversation holds N message(s) from
# people", or follows a line `do: [...]` in the message
# (agent-host/test/support/scripted-model.mjs). Ctrl-j adds a line in the
# composer. A step never follows Esc with another key: a terminal reads
# Esc and a key sent together as Alt and that key.

[[scenario]]
id = "t15-agent-answers-mention"
kind = "harness"
description = "v0.15 M2: an agent run by this bzz answers a mention in the TUI, once, in the thread the mention starts; a second mention in that thread shows the conversation's memory."
ready = "online"
exit = "__BZZ_HERDR_EXIT__:0"

[[scenario.step]]
keys = ["space", "space"]
visible = "channel finder"

[[scenario.step]]
